services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the localhost default so the api container reaches the redis service.
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./indexes:/app/indexes:ro
      - ./domains:/app/domains:ro
    depends_on:
      redis:
        condition: service_healthy

  # Run with: docker compose --profile indexer run --rm indexer domains/medical.yaml
  indexer:
    build: .
    command: python -m app.indexer.build
    env_file:
      - .env
    volumes:
      - ./indexes:/app/indexes
      - ./domains:/app/domains:ro
      - ./data:/app/data:ro
    profiles:
      - indexer
