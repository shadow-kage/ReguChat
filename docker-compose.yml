services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - ./domains:/app/domains:ro
      - ./indexes:/app/indexes:ro
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Run with: docker compose --profile indexer run --rm indexer domains/medical.yaml
  indexer:
    build: ./backend
    command: python -m app.indexer.build
    env_file:
      - .env
    volumes:
      - ./indexes:/app/indexes
      - ./domains:/app/domains:ro
      - ./data:/app/data:ro
    profiles:
      - indexer
